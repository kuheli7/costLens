[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "costlens"
version = "0.1.0"
description = "AWS cost root-cause engine: explains why the bill changed, with numbers an LLM cannot invent."
requires-python = ">=3.11"
dependencies = ["boto3>=1.34", "duckdb>=1.0"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "httpx>=0.27"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5", "moto[ec2,cloudwatch,cloudtrail,autoscaling,elbv2,s3]>=5", "fastapi>=0.110", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
